spring:
  datasource:
    url: jdbc:h2:mem:rentify-demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
app:
  jwt:
    secret: ${JWT_SECRET:${random.uuid}}
